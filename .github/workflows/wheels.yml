name: Wheels

on:
  push:
    branches: [main]
    tags: ["pypi-v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # cibuildwheel 4 dropped Python 3.8, so 3.8 builds with the last 3.x release.
      - uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: cp38-manylinux_*
      - uses: pypa/cibuildwheel@v4.3.5
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.arch }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Check the tag matches the SDK version
        if: startsWith(github.ref, 'refs/tags/pypi-v')
        run: |
          version=$(sed -n 's/^project(ugv_sdk VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          if [ "pypi-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $version"
            exit 1
          fi
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/pypi-v')
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/ugv-sdk-py
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
